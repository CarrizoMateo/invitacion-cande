<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cumpleaños 🎂</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- HERO / INVITACIÓN -->

    <main class="contenedor">

        <section class="invitacion">

            <div class="titulo">
                <span class="decoracion">✦</span>

                <p class="subtitulo">Estás invitado/a</p>

                <h1>Mi cumpleaños</h1>

                <span class="decoracion">✦</span>
            </div>


            <!-- IMAGEN PRINCIPAL -->

            <div class="imagen-container">

                <img
                    src="./img/img.jpg"
                    alt="Invitación de cumpleaños"
                    class="imagen-invitacion"
                >

            </div>


            <!-- BOTÓN FORMS -->

            <div class="confirmacion">

                <h2>¿Venís?</h2>

                <p>
                    Confirmá tu asistencia completando el formulario.
                </p>

                <a
                    href="https://forms.gle/235TrsTuDMR4aNUr7"
                    target="_blank"
                    class="boton"
                >
                    Confirmar asistencia
                    <span>→</span>
                </a>

            </div>


            <!-- UBICACIÓN -->

            <div class="ubicacion">

                <div class="separador">
                    <span>✦</span>
                </div>

                <p class="subtitulo">Nos encontramos en</p>

                <h2>¿Dónde es?</h2>

                <p class="direccion">
                    📍 Dirección del evento - Castelli 1571, Martínez, Provincia de Buenos Aires
                </p>


                <!-- MAPA -->

                <div class="mapa">

                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4936.857987359176!2d-58.519373987311816!3d-34.49314395155685!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcb056e44afddf%3A0x2eb9e90b2a60f5e5!2sCastelli%201571%2C%20B1640CFO%20Mart%C3%ADnez%2C%20Provincia%20de%20Buenos%20Aires!5e1!3m2!1ses-419!2sar!4v1789446417976!5m2!1ses-419!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
                        width="100%"
                        height="400"
                        style="border:0;"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            Hecho con ❤️
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
